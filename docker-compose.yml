version: '3.8'

services:
  coursera-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursera_bot_monitor
    restart: unless-stopped
    ports:
      # Port Web Dashboard (3987)
      - "3987:3987"
    # Cấp phát 2GB shared memory để Chromium không bị crash OOM khi render nặng
    shm_size: '2gb'
    env_file:
      - .env
    environment:
      - HEADLESS=true
      - DASHBOARD_PORT=3987
      - CHROME_USER_DATA_DIR=/app/data/chrome-profile
    volumes:
      # Lưu cookie đăng nhập Coursera để duy trì session sau khi restart container
      - ./data/chrome-profile:/app/data/chrome-profile
      # Lưu file log
      - ./logs:/app/logs
      # Mount file .env
      - ./.env:/app/.env:ro
